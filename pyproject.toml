[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism2api"
version = "0.1.1"
description = "Local Prism adapter runtime; live transport requires independent verification"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.40"]

[project.scripts]
prism2api = "prism2api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["loopback: allow loopback sockets for local integration tests only"]
